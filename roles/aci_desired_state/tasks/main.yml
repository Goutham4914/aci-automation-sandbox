---
# Routes to the correct task set based on deploy_mode passed from AWX.
# deploy_mode=main runs tenant object tasks (BD, AP, EPG, contract).
# All other modes run their own self-contained task file.

# ── UC1: Static path binding ──────────────────────────────────────────────────
- import_tasks: static_path.yml
  when: deploy_mode == 'static_path'

# ── UC2: vPC port channel ─────────────────────────────────────────────────────
- import_tasks: vpc.yml
  when: deploy_mode == 'vpc'

# ── UC3: L2Out ────────────────────────────────────────────────────────────────
- include_tasks: l2out.yml
  when: deploy_mode == 'l2out'

# ── UC4: L3Out ────────────────────────────────────────────────────────────────
- include_tasks: l3out.yml
  when: deploy_mode == 'l3out'

# ── Tenant objects: VRF, BD, AP, EPG, contract ───────────────────────────────
- block:
    - import_tasks: tenant.yml

    - name: Determine scoped object type
      ansible.builtin.set_fact:
        scoped_type: >-
          {{ target_file | regex_search('/(vrfs|bridge_domains|application_profiles|contracts|epgs)/') | regex_replace('/', '') }}
      when: target_file | length > 0

    # Scoped deploy — single file
    - import_tasks: vrf.yml
      when: target_file | length > 0 and scoped_type == 'vrfs'

    - import_tasks: bridge_domain.yml
      when: target_file | length > 0 and scoped_type == 'bridge_domains'

    - import_tasks: application_profile.yml
      when: target_file | length > 0 and scoped_type == 'application_profiles'

    - import_tasks: epg.yml
      when: target_file | length > 0 and scoped_type == 'epgs'

    - import_tasks: contract.yml
      when: target_file | length > 0 and scoped_type == 'contracts'

    # Full tenant reconciliation — no intent_file set
    - import_tasks: vrf.yml
      when: target_file | length == 0

    - import_tasks: bridge_domain.yml
      when: target_file | length == 0

    - import_tasks: application_profile.yml
      when: target_file | length == 0

    - import_tasks: epg.yml
      when: target_file | length == 0

    - import_tasks: contract.yml
      when: target_file | length == 0

  when: deploy_mode == 'main' or deploy_mode is not defined
