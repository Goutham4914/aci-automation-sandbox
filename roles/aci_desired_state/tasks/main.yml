---
# Single dispatcher — builds the task filename from deploy_mode.
# No when conditions, no skips. Only the matched file loads.

- name: Map deploy_mode to task file
  ansible.builtin.set_fact:
    dispatch_file: >-
      {{
        {
          'tenant':      'tenant.yml',
          'static_path': 'static_path.yml',
          'vpc':         'vpc.yml',
          'l2out':       'l2out.yml',
          'l3out':       'l3out.yml',
          'main':        '_main_objects.yml'
        }[deploy_mode | default('main')]
      }}

- name: "Dispatch → {{ dispatch_file }}"
  include_tasks: "{{ dispatch_file }}"
