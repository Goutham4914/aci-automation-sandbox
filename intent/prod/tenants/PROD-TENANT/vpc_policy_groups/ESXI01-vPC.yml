---
vpc:
  description: "ESXI01 vPC across leaf 101 and 102"

  vlan_pool:
    name: PROD-VLAN-POOL
    alloc_mode: static
    encap_blocks:
      - from: vlan-100
        to: vlan-200

  domain:
    name: PROD-PHY-DOMAIN
    type: phys

  aep:
    name: PROD-AEP

  lacp_policy: LACP-ACTIVE

  interface_policy_group:
    name: ESXI01-vPC-IPG
    lag_type: node              # node = vPC (bundle across two leaves)
    link_level_policy: 10G-AUTO
    cdp_policy: CDP-ON
    lldp_policy: LLDP-ON

  vpc_protection_group:
    name: LEAF101-102-vPC
    id: 1                       # unique vPC domain ID across the fabric
    leaf_1: 101
    leaf_2: 102

  leaf_interface_profile:
    name: ESXI01-vPC-IntP
    port: eth1/1                # same port ID on both leaves

  switch_profile:
    name: LEAF101-102-SwP

  # EPG static vPC path binding
  tenant: PROD-TENANT
  ap: PROD-APP
  epg: WEB-EPG
  pod: 1
  leaf_1: 101
  leaf_2: 102
  interface: eth1/1
  encap: vlan-100
  mode: regular                 # regular (trunk), native, untagged
