---
# Single entry point for all ACI deployments.
# AWX always runs this playbook — deploy_mode controls what gets deployed.
#
# AWX extra vars:
#   deploy_mode : main | static_path | vpc | l2out | l3out
#   deploy_env  : lab | prod | sandbox
#   tenant_path : e.g. intent/sandbox/tenants/TEST-TENANT
#   intent_file : e.g. intent/sandbox/tenants/TEST-TENANT/bridge_domains/TEST-BD.yml
#                 (required for scoped deploys, optional for deploy_mode=main full reconcile)
#   change_id   : e.g. CHG001 (audit reference only)
#
# deploy_mode values:
#   main        → tenant objects (BD, AP, EPG, contract) — scoped or full tenant reconcile
#   static_path → UC1: attach server, full interface policy stack + static path binding
#   vpc         → UC2: vPC port channel between server and two leaf switches
#   l2out       → UC3: full L2Out configuration
#   l3out       → UC4: full L3Out configuration

- name: Deploy ACI intent
  hosts: "{{ deploy_env }}_apic"
  gather_facts: false

  pre_tasks:
    - name: Load tenant manifest
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../{{ tenant_path }}/tenant.yml"

    - name: Load intent file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../{{ intent_file }}"
      when: intent_file | default('') | length > 0

  roles:
    - role: aci_desired_state
      vars:
        tenant_dir: "{{ playbook_dir }}/../{{ tenant_path }}"
        target_file: "{{ intent_file | default('') }}"
        deploy_mode: "{{ deploy_mode | default('main') }}"
