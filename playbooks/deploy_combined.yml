---
# Combined deployment playbook — auto-detects deploy mode from file paths
# Single entry point for deploying multiple objects in one run
#
# Extra vars:
#   deploy_env   : lab | prod | sandbox
#   tenant_path  : e.g. intent/sandbox/tenants/TEST-TENANT
#   intent_files : list of intent file paths (YAML list or comma-separated string)
#                  e.g. ['intent/sandbox/.../TEST-BD.yml', 'intent/sandbox/.../HOST01-eth1-1.yml']
#                  OR just a single file as a string
#   change_id    : e.g. CHG001 (audit reference)
#
# Auto-detection rules (from file path):
#   /vrfs/               → deploy_mode=main (scoped)
#   /bridge_domains/     → deploy_mode=main (scoped)
#   /application_profiles/ → deploy_mode=main (scoped)
#   /epgs/               → deploy_mode=main (scoped)
#   /contracts/          → deploy_mode=main (scoped)
#   /static_paths/       → deploy_mode=static_path
#   /vpc_policy_groups/  → deploy_mode=vpc

- name: Deploy ACI objects from intent files
  hosts: "{{ deploy_env }}_apic"
  gather_facts: false

  vars:
    # Normalize intent_files to a list
    normalized_files: >-
      {%- if intent_files is defined -%}
        {%- if intent_files is string -%}
          {%- if ',' in intent_files -%}
            {{ intent_files.split(',') | map('trim') | list }}
          {%- else -%}
            {{ [intent_files] }}
          {%- endif -%}
        {%- else -%}
          {{ intent_files }}
        {%- endif -%}
      {%- else -%}
        []
      {%- endif -%}

  pre_tasks:
    - name: Load tenant manifest
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../{{ tenant_path }}/tenant.yml"
      delegate_to: localhost

  tasks:
    - name: Deploy each intent file
      block:
        - name: Detect deploy mode from file path
          ansible.builtin.set_fact:
            detected_mode: >-
              {%- if '/static_paths/' in item -%}
              static_path
              {%- elif '/vpc_policy_groups/' in item -%}
              vpc
              {%- elif '/l2out/' in item -%}
              l2out
              {%- elif '/l3out/' in item -%}
              l3out
              {%- else -%}
              main
              {%- endif -%}

        - name: Load intent file
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../{{ item }}"
          delegate_to: localhost

        - name: Deploy {{ item }} (mode={{ detected_mode }})
          ansible.builtin.include_role:
            name: aci_desired_state
          vars:
            tenant_dir: "{{ playbook_dir }}/../{{ tenant_path }}"
            target_file: "{{ item }}"
            deploy_mode: "{{ detected_mode }}"

      loop: "{{ normalized_files }}"
      when: normalized_files | length > 0
